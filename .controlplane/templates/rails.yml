kind: workload
name: rails
spec:
  type: serverless
  containers:
    - name: rails
      cpu: 500m
      env:
        - name: PORT
          value: "3000"
      inheritEnv: true
      image: "{{APP_IMAGE_LINK}}"
      memory: 1Gi
      ports:
        - number: 3000
          protocol: http
  defaultOptions:
    autoscaling:
      metric: concurrency
      target: 100
      maxConcurrency: 0
      minScale: 0
      maxScale: 1
      scaleToZeroDelay: 900
    capacityAI: false
    timeoutSeconds: 120
  firewallConfig:
    external:
      inboundAllowCIDR:
        - 0.0.0.0/0
      outboundAllowCIDR:
        - 0.0.0.0/0
  identityLink: "{{APP_IDENTITY_LINK}}"
